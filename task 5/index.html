<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛍️ Mini Shop</h1>

        <button id="cartBtn">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>


    <main>

        <section class="hero">
            <h2>Welcome to Mini Shop</h2>
            <p>Choose your favorite products and add them to your cart.</p>
        </section>


        <section>
            <h2 class="section-title">Our Products</h2>

            <div id="productContainer" class="product-container">
                <!-- Products will be added using JavaScript -->
            </div>
        </section>

    </main>


    <!-- Cart Modal -->

    <div id="cartModal" class="modal">

        <div class="modal-content">

            <button id="closeModal" class="close-btn">
                ✕
            </button>

            <h2>🛒 Shopping Cart</h2>

            <div id="cartItems">
                <!-- Cart items will appear here -->
            </div>

            <div class="cart-total">
                Total: ₹<span id="cartTotal">0</span>
            </div>

            <button id="checkoutBtn" class="checkout-btn">
                Checkout
            </button>

        </div>

    </div>


    <!-- Checkout Modal -->

    <div id="checkoutModal" class="modal">

        <div class="modal-content checkout-content">

            <button id="closeCheckout" class="close-btn">
                ✕
            </button>

            <h2>✅ Checkout Preview</h2>

            <p id="checkoutSummary"></p>

            <button id="placeOrderBtn" class="checkout-btn">
                Place Order
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
